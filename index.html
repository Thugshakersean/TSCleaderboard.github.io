<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🏆 Leaderboard</h1>

    <form id="submit-form">
      <input id="name-input" type="text" placeholder="Your name" maxlength="20" required>
      <input id="score-input" type="number" placeholder="Score" min="0" required>
      <button type="submit">Submit</button>
    </form>

    <input id="search" type="text" placeholder="Search players...">

    <table id="board">
      <thead>
        <tr>
          <th data-key="rank">#</th>
          <th data-key="name">Player</th>
          <th data-key="score">Score</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="status"></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
